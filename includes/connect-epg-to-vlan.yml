- name: SPLIT INPUT TO TENANT-ANP-EPG
  set_fact:
    tenant: "{{ epg_name.split('|')[0] }}"
    anp: "{{ epg_name.split('|')[1] }}"
    epg: "{{ epg_name.split('|')[2] }}"

- name: CONVERT EPG NAME TO BD NAME
  set_fact:
    bd_name: "{{ epg | replace('epg_','bd_') }}"

- name: GET OUR VLAN ID
  set_fact:
    target_vlan_id: >-
      {{
        (vlan
        | selectattr('vlan-name', 'equalto', bd_name)
        | map(attribute='vlan-id')
        | list)[0]
      }}

- debug:
    msg: "VLAN ID for {{ bd_name }} is {{ target_vlan_id }}"

- name: BIND PHYSICAL HYPERV DOMAIN TO EPG
  cisco.aci.aci_epg_to_domain:
    host: "{{ inventory_hostname }}"
    username: "{{ username }}"
    password: "{{ password }}"
    state: "present"
    validate_certs: False
    tenant: "{{ tenant }}"
    ap: "{{ anp }}"
    epg: "{{ epg }}"
    domain: "dom_phys_hyperv"
    domain_type: "phys"
    suppress_verification: "true" # for testing purpose only
    annotation: ""

- name: BIND EPG STATIC HYPERV PORTS
  cisco.aci.aci_bulk_static_binding_to_epg:
    host: "{{ inventory_hostname }}"
    username: "{{ username }}"
    password: "{{ password }}"
    state: "present"
    validate_certs: False
    tenant: "{{ tenant }}"
    ap: "{{ anp }}"
    epg: "{{ epg }}"
    encap_id: "{{ target_vlan_id }}"
    interface_mode: trunk
    interface_configs:
      - interface: 1/1
        leafs: 101
        pod: 1
      - interface: 1/1
        leafs: 102
        pod: 1
      - interface: 1/8
        leafs: 101
        pod: 1
      - interface: 1/8
        leafs: 102
        pod: 1
    suppress_verification: "true" # for testing purpose only
    annotation: ""
